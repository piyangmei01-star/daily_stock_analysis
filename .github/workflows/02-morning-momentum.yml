name: 盘前强势股推送

on:
  schedule:
    - cron: '35 1 * * 1-5'   # 北京 9:35
    - cron: '58 1 * * 1-5'   # 备用：北京 9:58（防GitHub延迟/跳过）
  workflow_dispatch:
    inputs:
      force:
        description: '跳过防重复检查强制推送'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 判断近6小时是否已成功推送（防重复）
        id: check
        run: |
          LAST=$(gh run list --workflow=02-morning-momentum.yml --status=success --limit=1 --json createdAt --jq '.[0].createdAt' 2>/dev/null || echo "")
          SKIP=no
          if [ -n "$LAST" ]; then
            AGE=$(( $(date +%s) - $(date -d "$LAST" +%s) ))
            if [ "$AGE" -lt 21600 ]; then SKIP=yes; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "上次成功推送: ${LAST:-无} -> skip=$SKIP"
      - name: 安装依赖
        if: steps.check.outputs.skip != 'yes' || inputs.force == true
        run: pip install -r requirements.txt
      - name: 运行强势股筛选V2（归档+推送）
        if: steps.check.outputs.skip != 'yes' || inputs.force == true
        env:
          WECHAT_WEBHOOK_URL: ${{ secrets.WECHAT_WEBHOOK_URL }}
        run: python morning_push_v2.py
      - name: 业务结果校验与摘要
        if: steps.check.outputs.skip != 'yes' || inputs.force == true
        run: python verify_business.py momentum --allow-empty
      - name: 归档数据提交回仓库
        if: always()
        run: |
          git config user.name "v2-archive-bot"
          git config user.email "v2-archive-bot@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "data: momentum 归档 $(date -u +%Y%m%d-%H%M)"
          fi
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break || sleep 5
          done
